# Профиль канала «ИСТОРИК».
# Собран из ваших рабочих проектов ChatCut (пример монтажа «Джунгарское ханство и война с казахами»,
# «Вся история Золотой Орды за 8 минут», «Вся история кыргызов за 7 минут», «Сақтардың толық тарихы 8 минутта»,
# «Жизнь в каждом ранге Монгольской империи», шортсы). Правьте свободно — конвейер читает этот файл при каждом запуске.

channel:
  name: ИСТОРИК
  language: ru
  youtube_channel_id: ""      # UC...  (заполните — тогда темы учитывают ваши реальные видео и просмотры)
  youtube_handle: ""          # @handle
  niche: >-
    История Великой степи и Центральной Азии: казахи, кыргызы, монголы, тюрки, саки, гунны, ойраты/джунгары,
    Золотая Орда, Казахское ханство, кочевые империи, их войны, правители и повседневная жизнь;
    соседние империи (Китай, Россия, Персия) — через призму степи.
  audience: русскоязычные зрители Казахстана, Кыргызстана, Узбекистана, России, интересующиеся историей степи
  formats:
    - "Вся история X за N минут — полный обзор от начала до конца"
    - "Большой документальный разбор: государство + ключевая война"
    - "Жизнь в каждом ранге / как жили люди в эпоху X"
    - "Одна трагедия / одно событие крупным планом"

competitors: []              # каналы-конкуренты: channel_id (UC...) или @handle. Пусто = конкуренты находятся
                             # автоматически через поиск YouTube по запросам из config.yaml → topics.search_queries

published_topics:             # уже сделанные темы (дополняются автоматически после каждого проекта)
  - Вся история кыргызов за 7 минут
  - Вся история Золотой Орды за 8 минут
  - Сақтардың толық тарихы 8 минутта (вся история саков)
  - Жизнь в каждом ранге Монгольской империи
  - Джунгарское ханство и война с казахами (Актабан шубырынды)
  - Чингисхан — курултай 1206 года (шортс)
  - Зеленоглазые кыргызы (шортс)
  - Первый герой

script_style:
  tone: >-
    Серьёзный, спокойный, документальный, кинематографичный. Уважительный к народам и жертвам.
    Без клоунады, без мемов, без искусственного нагнетания. Короткие ясные предложения, которые хорошо звучат вслух.
  structure:
    - "ХУК (30–60 с): открыть конкретной сценой с датой и местом («Осенью 1723 года по казахской степи покатилась беда…»), показать масштаб и цену событий, назвать явление."
    - "ПЕРЕХОД К ТЕМЕ: «В этом ролике мы разберём всю историю …». Обещание зрителю: «Мы пойдём по порядку — от … до …»."
    - "ЧЕСТНОСТЬ ИСТОЧНИКОВ: «Там, где источники расходятся, мы будем прямо говорить об этом.»"
    - "ДЕЛИКАТНОСТЬ: при межэтнических конфликтах — оговорка «это рассказ об истории, а не о вражде народов»."
    - "СТАРТ: «Начнём с самого начала.» и вопрос-заголовок первой главы («Кто такие ойраты?»)."
    - "ГЛАВЫ (4–9): хронологически; каждая глава — одна крупная фаза; внутри: причина → событие → последствия; ключевые люди вводятся с кратким пояснением кто они."
    - "ПЕРЕХОДЫ между главами — логические мостики (что изменилось, к чему это привело)."
    - "ФИНАЛ: итог и наследие, как события повлияли на сегодняшние народы; спокойная сильная последняя фраза; мягкий призыв подписаться без суеты."
  rules:
    - Каждое утверждение — из исследования; спорные цифры подавать как оценки («по разным оценкам»).
    - Не повторять одни и те же факты в разных главах.
    - Даты писать цифрами (1723 год), имена — в общепринятой русской форме.
    - Не писать ради объёма; каждое предложение продвигает рассказ.
    - Текст только для чтения диктором — без ремарок, эмодзи, списков и заголовков внутри глав.
    - Числа до 10 и порядковые можно словами; века — римскими цифрами нельзя (TTS), пишем «в семнадцатом веке» или «в XVII веке» → «в 17 веке».

visual_style:
  look: >-
    cinematic historical realism, oil-painting-like dramatic lighting, muted earthy steppe palette with warm gold highlights,
    atmospheric haze, film grain, epic wide compositions, historically accurate costumes, armor and architecture
  suffix: "cinematic historical illustration, dramatic natural lighting, highly detailed, 16:9 widescreen composition, no text, no captions, no watermark, no logos"
  negative: "text, letters, captions, subtitles, watermark, logo, signature, modern objects, anachronisms, cartoon, anime, 3d render look, deformed hands, extra fingers, distorted faces, blurry, low quality, gore"
  visual_types: [establishing_wide, battle, portrait, crowd, map, city, daily_life, ritual, artifact, landscape, symbolic, aftermath]
  rules:
    - Один кадр = одна ясная сцена, соответствующая произносимому тексту.
    - Для карт — стилизованная старинная карта на пергаменте без надписей.
    - Персонажи одинаково описываются во всех кадрах (единая «библия персонажей»).
    - Трагедии показывать без натурализма: последствия, лица, пустые юрты, дым — без крови и расчленения.

editing_style:              # из проекта-примера ChatCut
  canvas: 1920x1080 @ 30 fps
  voice_track: A1
  images_track: V1
  overlays_track: V2
  sfx_track: A2
  zoom: чередование slow-push / slow-pull, magnification 1.4, фокус чуть выше центра
  hook: частая смена кадров (3–6 с), whip-pan / flash, Hook Punch плашки на ключевых фразах, taiko/whoosh
  title_reveal: после хука — малый текст → золотая линия → большое название → подзаголовок, drum sting
  chapters: Chapter Card 3 с + dip-to-black
  name_titles: при первом появлении значимого персонажа (слева снизу)
  date_stamps: ключевые даты (штамп на пергаменте, справа сверху)
  sfx_level_db: -8…-10
  subtitles: Montserrat 800, белый, обводка, текущее слово #FFD84A
